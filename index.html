<script>
const A=[
["一、工作同盟（Bordin）",[
["Although the working alliance has its seeds in Freud's writings about the importance of patient collaboration in psychoanalysis, recognition of the alliance as an important transtheoretical construct began with Bordin's (1979) seminal article.","雖然工作同盟的種子源自佛洛伊德論精神分析中病人合作之重要性的著作，但將同盟視為重要的「跨理論取向」概念，則始於Bordin（1979）的開創性文章。","transtheoretical＝跨理論的；seminal＝開創性的；seeds in＝源於"],
["Bordin defined the alliance as composed of three interrelated components: a trusting emotional bond and client-therapist agreement on the goals and tasks of therapy.","Bordin將同盟定義為三個相互關聯的成分：信任的情感連結，以及案主與治療師對治療目標與任務的共識。","三要素：Bond（情感連結）、Goals（目標）、Tasks（任務）"]],
"評論提示：可舉自身經驗（如教學／輔導中先建立信任、再與對方共訂目標），並指出同盟適用各學派。"],
["二、共同因素與真實關係",[
["Central to integrationism is the notion, substantiated by comprehensive literature reviews and meta-analyses (e.g., Norcross, 2002; Wampold, 2001), that various common factors, particularly the therapeutic relationship, account for change more than a therapist's choice of theoretical approach.","整合取向的核心概念是：多項共同因素，尤其是治療關係，比起治療師選擇何種理論取向，更能解釋治療的改變（此觀點獲完整文獻回顧與統合分析證實）。","substantiated＝證實；meta-analysis＝統合分析；common factors＝共同因素；account for＝解釋、佔…原因"],
["The vast theoretical and empirical literature on the therapeutic relationship was initiated by three counseling psychologists, the first of whom was Stanley Strong (1968), who described how therapists enhance their interpersonal power to motivate clients to change.","治療關係龐大的理論與實證文獻由三位諮商心理學家開啟，第一位是Stanley Strong（1968），他描述治療師如何增強其人際影響力以激發案主改變。","Strong → 人際影響力（power）"],
["Second was Edward Bordin (1979), who expanded and defined the psychoanalytic concept working alliance (also called therapeutic alliance) in terms that made it relevant to all therapeutic approaches.","第二位是Edward Bordin（1979），他擴充並界定精神分析的「工作同盟」（亦稱治療同盟），使其適用於所有治療取向。","Bordin → working alliance"],
["Third and most recently, Charles Gelso (2002) expanded yet another aspect of the therapeutic relationship, the real relationship.","第三位也是最近的是Charles Gelso（2002），他進一步擴展治療關係的另一個面向——真實關係。","Gelso → real relationship"],
["Each of these important contributions cannot be overemphasized because therapy success—regardless of theoretical approach—is substantially influenced by the strength and quality of the client-therapist relationship.","這些重要貢獻再怎麼強調都不為過，因為無論何種理論取向，治療成功都大幅受案主—治療師關係的強度與品質所影響。","cannot be overemphasized＝再強調也不為過"]],
"回答提示：(一) 核檢同盟可看目標、任務是否共識、情感連結是否穩固，並定期回饋確認。(二) 真實關係＝真誠（genuineness）＋符合現實的知覺（realism），即兩人以真實的自己互動，而非只有移情／技術。"],
["三、自我分化（Bowen）",[
["The relationship usually goes through predictable stages when one person begins to work on differentiating a self from the togetherness of the relationship.","當一個人開始努力從關係的「融合」中分化出自我時，關係通常會經歷可預測的階段。","differentiating a self＝自我分化；togetherness＝團體融合力"],
["In the words of Bowen, \"The family system is … disturbed when any family member moves toward a slightly higher level of differentiation, and it will move automatically to restore the family system to its former equilibrium.","用Bowen的話說：「當任何家庭成員朝稍高的分化程度移動時，家庭系統便受到擾動，並會自動運作，使系統回復到先前的平衡。」","equilibrium＝平衡（家庭恆定）"],
["Thus, any small step toward differentiation is accompanied by a small emotional upheaval in the family system.","因此，任何朝分化邁出的小步，都伴隨家庭系統中小小的情緒動盪。","upheaval＝動盪"],
["This pattern is so predictable that absence of an emotional reaction is good evidence that the differentiation effort was not successful.","此模式如此可預測，以致沒有情緒反應，正是分化努力並未成功的有力證據。","so…that＝如此…以致"],
["There are three predictable steps in the family reaction to differentiation. They are: (1) 'You are wrong' or some version of that; (2) 'Change back', which can be communicated in many ways, and (3) 'If you do not, these are the consequences.'","家庭對分化的反應有三個可預測步驟：(1)「你錯了」或類似說法；(2)「變回來」，可用多種方式傳達；(3)「若你不改變，後果如下」。","三步驟：指責 → 要求變回來 → 威脅後果"],
["If the differentiating one can stay on course without defending self or counterattacking, the emotional reaction is usually brief and the other then expresses appreciation in some way.","若正在分化的人能持續前進、不辯護也不反擊，情緒反應通常短暫，對方隨後會以某種方式表達感謝。","stay on course＝堅持方向；counterattack＝反擊"]],
"評論提示：可舉例（如設立界線後家人先不悅、後來理解），並說明分化≠切斷關係；亦可補充文化差異（華人家庭強調和諧，反應可能更強烈）。"],
["四、創傷事件與反應",[
["A trauma event can be human-made, such as a car accident, school shooting, street violence, family violence, etc. There are also natural trauma events, such as tornados, hurricanes, floods, earthquakes, fires, etc.","創傷事件可以是人為的，如車禍、校園槍擊、街頭暴力、家庭暴力等；也有天然的，如龍捲風、颶風、洪水、地震、火災等。","human-made vs. natural＝人為 vs. 天然"],
["Trauma events may impact people directly or indirectly. Indirect exposure may include seeing the disaster on television or hearing stories about others' experiences, possibly including risk of physical harm or death.","創傷事件可能直接或間接影響人；間接暴露包括在電視上看見災難，或聽聞他人經歷（可能涉及身體傷害或死亡風險）。","indirect exposure＝間接暴露（替代性創傷）"],
["Regardless of how individuals experienced the trauma/disaster, it is during this time that people might experience intense fear, helplessness, and hopelessness that exceed normal coping skills.","無論個人如何經歷創傷／災難，此時人們可能經歷超出正常因應能力的強烈恐懼、無助與絕望。","exceed coping skills＝超出因應能力"],
["After a traumatic event, some people may want to avoid remembering or feeling things that remind them of the traumatic experience, such as wanting to talk about the experience or going to the place of the event.","創傷事件後，有些人想避免回憶或感受會讓人想起創傷的事物，例如談論該經驗或回到事發地點。","原文 wanting 疑漏 not（應為「不想」談論／回去）；avoidance＝逃避"],
["Other reactions: sleeping difficulties, flashbacks, intense memories, sadness/depression, anger, helplessness, headaches/stomach aches/dizziness, difficulty being close to others, feeling numb, feeling life is short, wanting to be close to family and friends, over/undereating, memory and concentration problems, old beliefs and values being impacted.","其他反應：睡眠困難、閃回、強烈記憶、悲傷沮喪、憤怒、無助感、頭痛／胃痛／頭暈等身體問題、難與人親近、麻木、覺得人生短暫而想完成拖延之事（結婚、旅行、重返校園）、想親近家人朋友、飲食過多或過少、記憶與專注問題（A等生暫時變D等生，屬暫時且正常）、對自己／他人／世界的舊信念與價值觀受衝擊。","此為原文列點的濃縮翻譯"]],

["五、創傷症狀逐項解析與輔導",[
["Sleeping difficulties","睡眠困難","輔導：睡眠衛生、呼吸／漸進式放鬆、睡前把擔憂寫下來"],
["Flashbacks","閃回（彷彿事件重現）","輔導：著陸技巧（5-4-3-2-1 感官）、安全地方想像，說明那是記憶而非現在"],

["Feeling sad and depressed","悲傷沮喪","輔導：傾聽、情緒命名、允許哀悼；同時評估自傷風險"],

["Feeling numb","麻木","輔導：不逼迫情緒，透過感官活動與正念慢慢重新連結"],
["Feeling that life is very short","覺得人生短暫、想完成拖延之事","輔導：探索價值與意義（意義治療），把未竟心願排成可行步驟"],
["Wanting to be close to family and friends","想親近家人朋友","輔導：視為健康的求助行為，鼓勵運用社會支持"],

["Memory and concentration problems","記憶與專注問題","輔導：正常化為暫時現象、外部提醒、把任務拆小"],

const C=[

["Negative Reinforcement","ˈnɛɡətɪv ˌriːɪnˈfɔːrsmənt","負增強","移除厭惡刺激以提高行為頻率（不等於懲罰）。例：繫上安全帶警示音即停。","A 行為治療"],

["Libido","lɪˈbiːdoʊ","原慾／力比多","佛洛伊德：驅動行為的性本能心理能量。","H 精神分析治療"],

["Choice Theory","tʃɔɪs ˈθɪri","選擇理論","Glasser：行為是自己的選擇；五種基本需求（生存、愛與歸屬、權力、自由、樂趣）。","K 現實治療"],

["Shame-attacking","ʃeɪm əˈtækɪŋ","攻擊羞恥練習","Ellis：故意做被視為丟臉的小事，驗證「被笑就完蛋」的非理性信念。","N 理情行為治療"],

["Q：Bordin工作同盟短文評論（20%）","我同意Bordin的看法：同盟由情感連結、目標共識、任務共識組成。以我多年教學與輔導學生的經驗，若學生不信任我，再好的方法也無效；先建立關係、再與學生共訂小目標（如這週練習什麼）、並說明為何這樣做，學生才願意配合。反之，若只談技術而忽略連結，常出現抗拒或中斷。同盟的強度也需要持續檢核，這點與Bordin強調同盟會在過程中修復與調整相呼應。因此同盟是跨學派的共同基礎。"],
["Q：Q4（一）如何檢核或促成工作同盟（15%）","可從三面向：①連結——以同理、真誠、不評價的態度傾聽，留意案主非語言訊號；②目標——初談即與案主共同釐清期待並寫成具體可行的目標，定期回頭確認；③任務——說明介入方式的理由，詢問「這樣做對你有幫助嗎？」。實務上可用簡短的會談後回饋（如工作同盟量表）及時發現裂痕，坦誠討論並修復，裂痕修復本身就能強化同盟。"],
["Q：Q4（二）怎樣的諮商關係才是真實關係（15%）","依Gelso，真實關係是治療雙方以真誠（genuineness）與符合現實的知覺（realism）相處的部分：治療師不戴面具、不只是扮演角色，也能如實看待案主，不被移情扭曲。例如案主因進步而落淚，治療師真誠流露欣慰，這是真實的人對人回應。真實關係需有界限，不是自我揭露過度，而是為案主福祉服務。"],
["Q：Bowen自我分化短文——同意與否及理由（15%）","我同意。分化時家庭往往依序出現：指責、要求變回來、後果威脅，是系統回復恆定的反應。例如當事人第一次對長輩設立界線，常被說「你變了、不孝」。若能不辯解、不反擊、維持立場，情緒多半會平息，甚至得到理解。但需補充：①分化不是切斷關係，而是在連結中保持自我；②在重視和諧的華人文化中，反應可能更強烈，需更多耐心與支持；③若涉及暴力或安全風險，應先確保安全。"],
["Q：Q3 創傷——5症狀與輔導方案（20%）","請見「文章解析」第五篇逐項症狀與輔導。作答格式：症狀→方案→理論依據。例：睡眠困難→睡眠衛生與放鬆訓練（行為）；閃回→著陸技巧（穩定化）；悲傷→傾聽與情緒命名（個人中心）；難與人親近→安全關係與支持團體；舊信念受衝擊→認知重評與意義重建（認知／敘事）。"],
["Q：名詞解釋 topdog vs. underdog（10%）","完形治療（Perls）指內在兩種對立聲音：topdog 權威、苛求、說「你應該…」；underdog 則以消極抵抗、拖延、找藉口、示弱回應「我會努力，明天吧」。兩者持續拉扯，造成內在衝突。例：考生內心 topdog 說「你必須念到半夜」，underdog 回「我太累了，明天再說」。治療常用空椅技術讓兩邊對話，最終達到整合。"]];
